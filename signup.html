<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up - Petros Curious Mind</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
</head>

<body>

<header>
    <div class="brand">
        <img src="images/logo.png" alt="Petros Curious Mind Logo">
        <h1>Petros Curious Mind</h1>
    </div>

    <nav class="navbar">
        <a href="index.html">Home</a>
        <a href="story.html">Stories</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <button id="dark-mode-toggle" type="button">🌙</button>
        <a href="signin.html" id="account-link">Sign In</a>
    </nav>
</header>


<main>

    <section class="form-container">

        <h2>Create Your Account</h2>

        <p>
            Join Petros Curious Mind and explore the stories behind every story.
        </p>

        <form id="signup-form">

            <label for="name">Name</label>
            <input
                type="text"
                id="name"
                placeholder="Enter your name"
                required
            >

            <label for="age">Age</label>
            <input
                type="number"
                id="age"
                placeholder="Enter your age"
                min="1"
                required
            >

            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Create a password"
                required
            >

            <button type="submit" class="btn">
                Create Account
            </button>

        </form>

        <p id="message"></p>

        <p>
            Already have an account?
            <a href="signin.html">Sign In</a>
        </p>

    </section>

</main>


<footer>
    <p>
        © 2026 Petros Curious Mind. All rights reserved.
    </p>

    <p>
        The Story Behind Every Story
    </p>
</footer>


<script>

const signupForm = document.getElementById("signup-form");
const message = document.getElementById("message");


signupForm.addEventListener("submit", async function (e) {

    e.preventDefault();

    const name = document.getElementById("name").value.trim();
    const age = document.getElementById("age").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;


    if (!name || !age || !email || !password) {

        message.textContent = "Please fill in all fields.";
        return;
    }


    message.textContent = "Creating your account...";


    try {

        /*
         * STEP 1
         * Create the Supabase Auth account.
         */

        const { data, error } =
            await supabaseClient.auth.signUp({

                email: email,

                password: password,

                options: {

                    data: {
                        name: name,
                        age: age
                    }

                }

            });


        if (error) {
            throw error;
        }


        /*
         * STEP 2
         * Make sure Supabase returned the new user's ID.
         */

        if (!data.user) {

            throw new Error(
                "Account was created, but the user ID was not returned."
            );

        }


        /*
         * STEP 3
         * Create the matching profile.
         *
         * The ID here is EXACTLY the same
         * as the Supabase Auth user's ID.
         */

        const { error: profileError } =
            await supabaseClient
                .from("profiles")
                .upsert({

                    id: data.user.id,

                    name: name,

                    age: Number(age)

                });


        if (profileError) {

            console.error(
                "Profile creation error:",
                profileError
            );

            throw new Error(
                "Account created, but your profile could not be created: " +
                profileError.message
            );

        }


        /*
         * STEP 4
         * Success.
         */

        message.textContent =
            "Account created successfully! " +
            "Check your email if confirmation is required.";


        signupForm.reset();


    } catch (error) {

        console.error("Signup error:", error);

        message.textContent = error.message;

    }

});


/*
 * DARK MODE
 */

const darkModeToggle =
    document.getElementById("dark-mode-toggle");


if (localStorage.getItem("darkMode") === "enabled") {

    document.body.classList.add("dark-mode");

    if (darkModeToggle) {
        darkModeToggle.textContent = "☀️";
    }

}


if (darkModeToggle) {

    darkModeToggle.addEventListener("click", function () {

        document.body.classList.toggle("dark-mode");


        if (document.body.classList.contains("dark-mode")) {

            localStorage.setItem("darkMode", "enabled");

            darkModeToggle.textContent = "☀️";

        } else {

            localStorage.setItem("darkMode", "disabled");

            darkModeToggle.textContent = "🌙";

        }

    });

}

</script>

</body>
</html>
